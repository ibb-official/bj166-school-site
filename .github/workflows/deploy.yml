name: Build and Deploy Next.js to sofia-vps

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  statuses: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build Next.js Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vm:
    name: Deploy to sofia-vps (direct SSH)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH diagnostics (writes result to commit status)
        if: always()
        env:
          SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          SSH_USER: ${{ secrets.VM_SSH_USER }}
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            OUT="missing-secrets host=${SSH_HOST:-EMPTY} keylen=${#SSH_KEY}"
            RC=9
          else
            OUT=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 -p "${SSH_PORT:-22}" "${SSH_USER:-root}@${SSH_HOST}" 'hostname; whoami; ls -l /opt/bj166-site/docker-compose.yml' 2>&1)
            RC=$?
          fi
          echo "----- diag output -----"
          echo "$OUT"
          echo "----- rc=$RC -----"
          MSG=$(printf '%s' "$OUT" | paste -sd' ' - | cut -c1-130)
          STATE=$([ "$RC" -eq 0 ] && echo success || echo failure)
          curl -sS -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "{\"state\":\"$STATE\",\"context\":\"deploy-diag\",\"description\":\"$MSG\"}" > /dev/null

      - name: Deploy container on sofia-vps
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          port: ${{ secrets.VM_SSH_PORT }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GH_ACTOR,GH_TOKEN
          script: |
            set -e
            EXPECTED_HOSTNAME="r-server89187-mls"
            ACTUAL_HOSTNAME="$(hostname)"
            echo "==> Deployment target: $ACTUAL_HOSTNAME (machine-id $(cut -c1-12 /etc/machine-id))"
            if [ "$ACTUAL_HOSTNAME" != "$EXPECTED_HOSTNAME" ]; then
              echo "!! Refusing to deploy: SSH landed on '$ACTUAL_HOSTNAME', expected '$EXPECTED_HOSTNAME'."
              echo "!! Verify the VM_SSH_HOST / VM_SSH_PORT / VM_SSH_USER / VM_SSH_KEY secrets."
              exit 1
            fi
            if [ ! -f /opt/bj166-site/docker-compose.yml ]; then
              echo "!! /opt/bj166-site/docker-compose.yml is missing on the target. Aborting before pull."
              exit 1
            fi
            echo "==> Authenticating to GHCR on sofia-vps..."
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            # Do not leave the short-lived GITHUB_TOKEN in /root/.docker/config.json
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "==> Pulling latest image on sofia-vps..."
            cd /opt/bj166-site
            docker compose pull || docker-compose pull
            echo "==> Restarting site container..."
            docker compose up -d --remove-orphans || docker-compose up -d --remove-orphans
            echo "==> Running local healthcheck..."
            sleep 3
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/)
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "Deployment succeeded! HTTP 200 received."
              docker inspect bj166-web --format 'image={{.Config.Image}} container={{.Image}} created={{.Created}}'
            else
              echo "Healthcheck failed with status code $HTTP_CODE!"
              docker logs --tail 50 bj166-web
              exit 1
            fi
